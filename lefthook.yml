# Git hooks. The stations come from the hookset presets (burgee packages/hookset), pinned by tag:
# bump `ref` to take a new preset version. `hookset check` (CI) fails on a missing station, an
# unpinned ref, or a step here that repeats one a preset runs.
remotes:
  - git_url: https://github.com/ofri-peretz/burgee
    ref: hookset@0.3.0
    configs:
      - packages/hookset/presets/lefthook/commit-msg.yml
      - packages/hookset/presets/lefthook/pre-commit.yml
      - packages/hookset/presets/lefthook/pre-push.yml

# Repo-specific steps go below, under the hook they belong to. The presets call the repo's own
# `hook:staged` and `hook:verify` scripts (package.json), so most repos need nothing here.

commit-msg:
  commands:
    # Local until hookset@0.4.0, whose commit-msg preset runs this same script; delete this step
    # when `ref` moves to it (`hookset check` fails on a step that repeats a preset's).
    provedone:
      run: npm run --silent hook:provedone -- {1}
      fail_text: "The message needs a receipt trailer: 'Verified-by: <command> -> exit 0' or 'Verified-by: none (<reason>)'."
